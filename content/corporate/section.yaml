title: Corporate
description: 企業・団体さまの想いやサービスの魅力を、写真と映像で伝えるお手伝いをしています。
lede: |-
  企業・団体さまの想いやサービスの魅力を、写真と映像で伝えるお手伝いをしています。

  映像は、SNS向け動画から、広告動画、店頭・街頭で流すサイネージ映像まで、用途や<span class="u-nowrap">掲載先に合わせて</span>制作しています。<br class="pc-only" />写真では、宣材写真・プロフィール写真から、イベント撮影まで、幅広い現場を経験してきました。

  企画・撮影・編集までを一貫して対応できるため、「何をどう伝えればいいかわからない」という段階からでもご相談いただけます。<br class="pc-only" /><span class="u-nowrap">医療・ヘルスケア</span>分野では、現役薬剤師としての知識と視点を活かしたご提案・制作が可能です。




