title: Corporate
description: 企業・団体さまの想いやサービスの魅力を、写真と映像で伝えるお手伝いをしています。
lede: |-
  企業・団体さまの想いやサービスの魅力を、写真と映像で伝えます。

  SNS動画や広告映像、<span class="u-nowrap">宣材・プロフィール写真</span>、イベント撮影まで。<br class="pc-only" />企画から撮影・編集まで一貫して対応するので、<br class="pc-only" /><span class="u-nowrap">「何を伝えればいいかわからない」</span>段階からご相談いただけます。

  医療・ヘルスケア分野では、現役薬剤師の視点を活かした制作が可能です。
