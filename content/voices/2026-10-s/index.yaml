name: S さま
kind: business
comment: |-
  希望する写真のイメージから、撮影場所やポージングまで丁寧にアドバイスをいただいたおかげで、とても素敵な素材を撮影していただきました✨
  また、撮影の際も全体的な光の加減や目への光の入り方など、とても細かく調整しながら撮影をしていただき、めいさんの撮影技術にも圧巻されました。
  何よりも、めいさんのお人柄が素敵で終始撮影も楽しくあっという間の時間でした🍃
  出来上がった写真もとても好評で、私の魅力をたくさん引き出していただきました。
  また次回もぜひご依頼させていただきたいです✨
  ありがとうございました。
