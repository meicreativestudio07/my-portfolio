name: Y さま
kind: wedding
comment: |-
  撮影場所を決める際に、家からの距離や場所ごとの料金、撮影スポットの良いところなどを分かりやすくまとめて送ってくれたのが、すごくありがたかったです！緑のある公園と砂浜、どちらも楽しめる場所を探してくれて、場所選びからとても丁寧に考えてくれているのが伝わりました。

  撮影中もポーズをたくさん考えてくれていたので、自分たちでどう撮るか悩むことなく、安心して楽しく撮影できました。動画撮影についても、事前に構成を考えてくれていたおかげで、無駄なくスムーズに撮影を進められたのが良かったです！

  さらに、小道具だけでなく虫除けスプレーなどの細かい備品まで用意してくれていて、暑い中でも熱中症対策をしながら快適に撮影できるよう配慮してくれたことも、とても嬉しかったです。

  撮影前の準備から当日の進行まで、細かいところまで考えてくれていたおかげで、最高の思い出になりました！
