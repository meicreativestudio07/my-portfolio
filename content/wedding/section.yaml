title: Wedding
description: 前撮りを中心にした結婚の写真の仕事。
lede: >-
  おふたりの結婚前撮りを、写真と映像の両方で撮影しています。


  写真はもちろん、動きや声、その場の空気まで残せる映像もあわせて残すことで、何年たっても当日の気持ちを鮮やかに思い出せるような記録をお届けします。写真のみ、映像のみ、両方セットなど、ご希望に合わせてご相談いただけます。


  撮影で大切にしているのは、仕上がった作品だけでなく、撮影の時間そのものが素敵な思い出になることです。緊張しがちな撮影も、おふたりらしく自然体で楽しんでいただけるよう、会話や雰囲気づくりを心がけています。「あの日、楽しかったね」と振り返ってもらえるような一日を、一緒につくれたら嬉しいです。


  こちらでは、これまでに撮影した前撮りの一部をご紹介しています。ムービー作品は、カーソルを重ねると別のシーンに切り替わります。
